<!DOCTYPE html>
<html lang="en">

    <body>
        <div id="container">
            <h1>Week 2 JavaScript Lab</h1>
            <a href="../index.html">Link Back to Main Page</a>
            <br>
            <hr>
            <h2>Button Clicker</h2>
            <p><i>The completely new and innovative game that definitely hasn't been done before!</i></p>
            <br>
            <h3 id="output">0</h3>
            <input type="button" value="Click" id="btn">
            <input type="button" value="Clear Clicks" id="btn_reset">
        </div>

        <!-- Example JS script -->
         <script>
            // Test JS script, keeping for future reference and not function
            // var name = prompt("What is your name?");
            // var firstNumber = prompt("Give me one random number.");
            // var secondNumber = prompt("Give me a second random number.");
            // var value = firstNumber * secondNumber;
            // var message = `Hello ${name}.
            //     \n Your first number was ${firstNumber}.
            //     \n Your second number was ${secondNumber}.
            //     \n Your value is: ${value}.`;
            // console.log(message);
            // document.getElementById("message").innerHTML = message;
            // document.getElementById("message").style.color = "blue";

            // Button Clicker game code
            var clickerButton = document.querySelector("#btn");
            var clearButton = document.querySelector("#btn_reset");
            var clickerOutput = document.querySelector("#output");

            var clickNum = 0;

            function updateDisplayOutput(){
                clickerOutput.innerHTML = clickNum
            }

            clickerButton.addEventListener("click", function(){
                clickNum++;
                updateDisplayOutput();
            });

            clearButton.addEventListener("click", function(){
                clickNum = 0
                updateDisplayOutput();
            });

         </script>
    </body>

<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Week 2 JavaScript Lab</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            @font-face {
                font-family: undertaleTypeface;
                src: url(fonts/PixelOperator.ttf);
            }
            @font-face {
                font-family: genText;
                src: url(fonts/terminal16unicode.ttf);
            }
            body{
                background-color: rgb(213, 180, 224);
            }
            #container{
                width: 100%;
                text-align: center;
            }
            #output{
                color: white;
                background-color: black;
                font-size: 60px;
                width: 500px;
                margin-left: auto;
                margin-right: auto;
                font-family: "undertaleTypeface";
                border: 4px solid white;
            }
            h1, h2, p, a, input{
                font-family: "genText";

            }
            #btn:hover, #btn_reset:hover{
                transform: scale(1.05);
            }
            #btn:active, #btn_reset:active{
                transform: scale(0.9);
            }
        </style>
    </head>
    <body>
        <div id="container">
            <h1>Week 2 JavaScript Lab</h1>
            <a href="../index.html">Link Back to Main Page</a>
            <br>
            <hr>
            <h2>Button Clicker</h2>
            <p><i>The completely new and innovative game that definitely hasn't been done before!</i></p>
            <h3 id="output">0</h3>
            <button type="button" id="btn" style="background: none; border: none;">
                <img src="../week1/images/buttonclicker.png" alt="Button Image" width="150">
            </button>
            <br>
            <!-- <input type="button" value="Click" id="btn"> -->
            <input type="button" value="Clear Clicks" id="btn_reset">
        </div>

        <!-- Example JS script -->
         <script>
            // Test JS script, keeping for future reference and not function
            // var name = prompt("What is your name?");
            // var firstNumber = prompt("Give me one random number.");
            // var secondNumber = prompt("Give me a second random number.");
            // var value = firstNumber * secondNumber;
            // var message = `Hello ${name}.
            //     \n Your first number was ${firstNumber}.
            //     \n Your second number was ${secondNumber}.
            //     \n Your value is: ${value}.`;
            // console.log(message);
            // document.getElementById("message").innerHTML = message;
            // document.getElementById("message").style.color = "blue";

            // Button Clicker game code
            var clickerButton = document.querySelector("#btn");
            var clearButton = document.querySelector("#btn_reset");
            var clickerOutput = document.querySelector("#output");
            // the below file name IS correct. It's taken from Minecraft, which formats sounds with ".ogg" but the wiki has it formatted in ".mp3" so it results in ".ogg.mp3".
            var clickerSound = new Audio("audio/Click_stereo.ogg.mp3");

            var clickNum = 0;

            function updateDisplayOutput(){
                clickerOutput.innerHTML = clickNum
            }

            clickerButton.addEventListener("click", function(){
                clickNum++;
                updateDisplayOutput();
                clickerSound.currentTime = 0;
                clickerSound.play();
            });

            clearButton.addEventListener("click", function(){
                clickNum = 0
                updateDisplayOutput();
                clickerSound.currentTime = 0;
                clickerSound.play();
            });

         </script>
    </body>
</html>
